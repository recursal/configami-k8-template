##############################################################
#
# service routing 
#
##############################################################
apiVersion: v1
kind: Service
metadata:
  name: {{name}}
  namespace: {{namespace}}
  annotations:
    field.cattle.io/ipAddresses: "null"
    field.cattle.io/targetDnsRecordIds: "null"
    {{#if deploymentName}}
    field.cattle.io/targetWorkloadIds: '["{{deploymentType}}:{{namespace}}:{{deploymentName}}"]'
    {{else}}
    field.cattle.io/targetWorkloadIds: '["{{deploymentType}}:{{namespace}}:{{name}}"]'
    {{/if}}
    {{#if extraAnnotations}}
    # Caller supplied annotations (e.g. cloud load-balancer settings)
    {{#json2yaml "extraAnnotations"}}{{/json2yaml}}
    {{/if}}
spec:
  {{#if serviceType}}
  # Explicit service type (e.g. LoadBalancer) - no clusterIP block
  type: {{serviceType}}
  {{#if externalTrafficPolicy}}
  # Local preserves client source IP (only nodes with a pod pass the LB
  # health check); Cluster spreads across all nodes
  externalTrafficPolicy: {{externalTrafficPolicy}}
  {{/if}}
  {{else}}
  {{#if nodePort}}
  type: NodePort
  {{else}}
  {{#if clusterIP}}
  {{#contains clusterIP "None"}}
  # No clusterIP is assigned - None
  clusterIP: None
  {{else}}
  {{#contains clusterIP "auto"}}
  # `clusterIP: "auto"` - nothing is assigned, lets system auto assign
  {{else}}
  # This is a fixed clusterIP to be assigned
  clusterIP: {{clusterIP}}
  {{/contains}}
  {{/contains}}
  {{else}}
  # No clusterIP is assigned - None
  clusterIP: None
  {{/if}}
  {{/if}}
  {{/if}}
  ports:
  {{#if serviceType}}
  {{#if portsArray}}
  # Full port list supplied by the caller (name/port/targetPort/protocol).
  # Only honoured in explicit serviceType mode: plans composed via
  # deployment-with-service pass portsArray for the Deployment (containerPort
  # shape), and legacy ClusterIP rendering must stay untouched.
  {{#json2yaml "portsArray"}}{{/json2yaml}}
  {{else}}
  - name: {{portName}}
    port: {{port}}
    protocol: {{portProtocol}}
    {{#if targetPort}}
    targetPort: {{targetPort}}
    {{else}}
    targetPort: {{port}}
    {{/if}}
  {{/if}}
  {{else}}
  - name: {{portName}}
    port: {{port}}
    protocol: {{portProtocol}}
    {{#if targetPort}}
    targetPort: {{targetPort}}
    {{else}}
    targetPort: {{port}}
    {{/if}}
    {{#if nodePort}}
    nodePort: {{nodePort}}
    {{/if}}
  {{/if}}
  selector:
    {{#if customSelector}}
    {{#each customSelector}}
    {{@key}}: {{this}}
    {{/each}}
    {{else}}
    {{#if deploymentName}}
    workload.user.cattle.io/workloadselector: {{deploymentType}}-{{namespace}}-{{deploymentName}}
    {{else}}
    workload.user.cattle.io/workloadselector: {{deploymentType}}-{{namespace}}-{{name}}
    {{/if}}
    {{/if}}
  sessionAffinity: None
  {{#contains clusterIP "None"}}
  # No topologyKeys assigned - not compatible with clusterIP "None"
  {{else}}
  {{#if serviceTopologyKeyPreference}}
  # Configure topologyKeys to prefer localhost, followed by cluster zone/region, etc
  topologyKeys:
    {{#eq serviceTopologyKeyPreference "host"}}
    # Host preferred topology key routing
    - "kubernetes.io/hostname"
    - "topology.kubernetes.io/zone"
    - "topology.kubernetes.io/region"
    {{/eq}}
    {{#eq serviceTopologyKeyPreference "zone"}}
    # Zone preferred topology key routing
    - "topology.kubernetes.io/zone"
    - "topology.kubernetes.io/region"
    {{/eq}}
    {{#eq serviceTopologyKeyPreference "region"}}
    # Region preferred topology key routing
    - "topology.kubernetes.io/region"
    {{/eq}}
    - "*"
  {{else}}
  # Topology keys are disabled
  {{/if}}
  {{/contains}}
  {{#unless serviceType}}
  {{#if nodePort}}
  {{else}}
  type: ClusterIP
  {{/if}}
  {{/unless}}
---
